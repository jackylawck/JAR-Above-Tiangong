<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA 全螢幕沉浸標籤 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020308">

  <title>J.A.R. 天宮之上 3D | Above Tiangong 3D</title>
  <link rel="stylesheet" href="css/mobile-style.css">
  
  <!-- 模組加載相容性 Polyfill -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
      }
    }
  </script>
</head>
<body oncontextmenu="return false;" style="overscroll-behavior: none;">
  <canvas id="webgl-canvas"></canvas>

  <div id="hud-overlay">
    <!-- 頂部主飛行儀表 -->
    <div class="flight-director">
      <div class="primary-telemetry">
        <div class="pri-data-row">
          <span id="title-tag" class="interactive" style="cursor:pointer;">
            <span data-i18n="appTitle">J.A.R. 天宮之上 3D</span>
            <span style="font-size:10px; opacity:0.6;">[V4.5-CDR]</span>
          </span>
        </div>
        
        <div class="pri-data-row" style="font-size: 15px; margin-top: 4px;">
          <span data-i18n="rangeLabel">距離</span>: <span id="val-range" style="color:#fff;">0.00</span> m | 
          <span data-i18n="rateLabel">速度</span>: <span id="val-rate" style="color:#fff;">0.00</span> m/s
        </div>

        <div class="sec-data-row">
          <span><span data-i18n="fsmLabel">狀態</span>: <span id="val-fsm" style="color:#00ffaa;">V-BAR APPROACH</span></span> | 
          <span><span data-i18n="fuelLabel">燃料</span>: <span id="val-fuel">300.0</span> kg</span>
        </div>

        <div id="telem-stream" style="font-size:9px; opacity:0.75; margin-top:6px; border-top:1px solid rgba(0,255,170,0.25); padding-top:4px; display:flex; gap:10px; flex-wrap:wrap;">
          <span>🛰️ <span data-i18n="altLabel">高度</span>: <span id="val-alt">400.0</span> km</span>
          <span>⚡ <span data-i18n="rpyLabel">姿態(R/P/Y)</span>: <span id="val-rpy">0.0 / 0.0 / 0.0</span>°</span>
          <span>🎯 <span data-i18n="offsetLabel">對接軸偏差</span>: <span id="val-offset">0.00</span> m</span>
          <span>⏱️ <span data-i18n="covLabel">MEKF方差</span>: <span id="val-cov">0.0010</span></span>
        </div>
      </div>

      <!-- 控制按鈕組 -->
      <div class="btn-group interactive">
        <button id="btn-diff" class="hud-btn interactive" style="border-color:#ffaa00; color:#ffaa00;">🛠️ 進階模式</button>
        <button id="btn-mode" class="hud-btn interactive"><span data-i18n="modeBtn">模式: 自動</span></button>
        <button id="btn-abort" class="hud-btn btn-abort interactive"><span data-i18n="abortBtn">緊急中止</span></button>
        <button id="btn-lang" class="hud-btn interactive">EN / 繁中</button>
      </div>
    </div>

    <!-- CBARS 十字光學瞄準具 -->
    <div id="crosshair-container">
      <div class="crosshair-circle"></div>
      <div id="crosshair-reticle" class="crosshair-reticle"></div>
    </div>

    <!-- 底部虛擬雙搖桿 -->
    <div class="joystick-container">
      <div id="zone-trans" class="stick-zone interactive">
        <span class="stick-label" data-i18n="transLabel">RCS 平移 (X/Y)</span>
        <div id="knob-trans" class="stick-knob"></div>
      </div>
      <div id="zone-rot" class="stick-zone interactive">
        <span class="stick-label" data-i18n="rotLabel">姿態 (P/Y)</span>
        <div id="knob-rot" class="stick-knob"></div>
      </div>
    </div>

    <!-- J.A.R. 敘事字幕框 -->
    <div id="narrative-box" class="narrative-box">
      <span class="jar-tag">J.A.R.</span>
      <span id="narrative-text">系統初始化中...</span>
    </div>

    <!-- 任務結算畫面 -->
    <div id="mission-report" class="modal-overlay hidden">
      <div class="report-card">
        <h2 style="color:#00ffaa; margin:0 0 10px 0; border-bottom:1px solid #00ffaa; padding-bottom:5px;">任務結算 (REPORT)</h2>
        <div class="report-row">評級 (RATING): <span id="score-grade" style="font-size:24px; font-weight:bold; color:#ffaa00;">S</span></div>
        <div class="report-row">耗時 (TIME): <span id="score-time">0</span> 秒</div>
        <div class="report-row">剩餘燃料 (FUEL): <span id="score-fuel">0</span> kg</div>
        <div class="report-row">姿態偏差 (ERROR): <span id="score-error">0</span>°</div>
        <button id="btn-restart" class="hud-btn interactive" style="width:100%; margin-top:15px; background:#00ffaa; color:#000;">執行下一次任務</button>
      </div>
    </div>
  </div>

  <!-- 手勢防誤觸與縮放攔截 -->
  <script>
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchmove', function (event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('dblclick', function (event) {
      event.preventDefault();
    }, { passive: false });
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
