<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>J.A.R. 天宮之上 3D | Above Tiangong 3D</title>
  <link rel="stylesheet" href="css/mobile-style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="hud-overlay">
    <div class="header-bar">
      <div class="telemetry-card">
        <div id="title-tag" class="interactive">
          <span data-i18n="appTitle" class="highlight">J.A.R. 天宮之上 3D</span> 
          <span style="font-size:9px; opacity:0.7;">[V4.2]</span>
        </div>
        <div><span data-i18n="fsmLabel">狀態</span>: <span id="val-fsm" class="highlight">V-BAR APPROACH</span></div>
        <div><span data-i18n="rangeLabel">距離</span>: <span id="val-range">0.00</span> m | <span data-i18n="rateLabel">速度</span>: <span id="val-rate">0.00</span> m/s</div>
        <div><span data-i18n="biasLabel">MEKF 零偏</span>: <span id="val-bias">0.000, 0.000</span> rad/s</div>
        <div><span data-i18n="fdirLabel">星敏冗餘</span>: <span id="val-fdir" style="color:#00ff66;">3/3 TMR NOMINAL</span></div>
        <div><span data-i18n="fuelLabel">燃料</span>: <span id="val-fuel">300.0</span> kg | <span data-i18n="massLabel">總重</span>: <span id="val-mass">3300.0</span> kg</div>
      </div>

      <div class="btn-group interactive">
        <button id="btn-mode" class="hud-btn"><span data-i18n="modeBtn">模式: 自動</span></button>
        <button id="btn-abort" class="hud-btn btn-abort"><span data-i18n="abortBtn">緊急中止</span></button>
        <button id="btn-lang" class="hud-btn">EN / 繁中</button>
      </div>
    </div>

    <div id="crosshair-container">
      <div class="crosshair-circle"></div>
      <div id="crosshair-reticle" class="crosshair-reticle"></div>
    </div>

    <div class="joystick-container">
      <div id="zone-trans" class="stick-zone interactive">
        <span class="stick-label" data-i18n="transLabel">RCS 平移 (X/Y)</span>
        <div id="knob-trans" class="stick-knob"></div>
      </div>
      <div id="zone-rot" class="stick-zone interactive">
        <span class="stick-label" data-i18n="rotLabel">姿態 (P/Y)</span>
        <div id="knob-rot" class="stick-knob"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
